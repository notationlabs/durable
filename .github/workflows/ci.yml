name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --filter '!@notation/durable-docs'
      - run: pnpm exec pok build
      - run: pnpm exec pok typecheck
      - run: pnpm exec pok test bun
      # Installs the packed packages and runs the conformance suites under Node.
      - run: pnpm exec pok test conformance
