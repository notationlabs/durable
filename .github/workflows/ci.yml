name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --filter '!@notation/durable-docs'
      - run: pnpm exec pok build
      - run: pnpm exec pok typecheck
      - run: pnpm exec pok test bun
      # Node cannot resolve the extensionless imports in the private packages'
      # source. tsx loads it, in the suite and in the processes the suite starts.
      - run: node ./node_modules/vitest/vitest.mjs run
        env:
          NODE_OPTIONS: --import tsx
      - run: pnpm exec pok test conformance
